# Meridian configuration. Environment variables (or .env) supply the API keys.

llm:
  provider: groq
  providers:
    groq:
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      requests_per_minute: 25          # free tier allows 30; stay under it
  # Model per agent role. Any model the provider serves works. Groq's free tier
  # allows 8k tokens a minute per model, so the roles are spread over three.
  models:
    planner: openai/gpt-oss-120b
    researcher: qwen/qwen3.8-27b        # writes search queries: fast and cheap is enough
    critic: openai/gpt-oss-120b         # follows the coverage instructions; 20b repeated gaps verbatim
    synthesizer: openai/gpt-oss-120b
  # Extra request parameters per model. gpt-oss models reason before answering and
  # the reasoning counts against max_tokens, hence low effort and a higher floor.
  model_params:
    openai/gpt-oss-120b: {reasoning_effort: low, max_tokens_floor: 2048}
    openai/gpt-oss-20b: {reasoning_effort: low, max_tokens_floor: 2048}
  cache_path: data/llm_cache.sqlite

agent:
  max_research_iterations: 2           # critic → researcher loops after the first pass
  max_subtasks: 4

researcher:
  findings_per_subtask: 5
  semantic_cache_threshold: 0.92       # cosine similarity to reuse earlier findings
  finding_chars: 1200

synthesizer:
  max_sources: 10

tools:
  enabled: [wikipedia, arxiv, web_search, read_pdf, python]
  timeout_s: 15
  # Tavily if TAVILY_API_KEY is set, else You.com's free endpoint. Hard cap per UTC day,
  # shared by every session and the evaluation; nothing over it is ever sent.
  web_search_daily_limit: 100

memory:
  db_path: data/meridian.sqlite
  semantic_index_dir: data/semantic
  embedding_model: BAAI/bge-small-en-v1.5

evaluation:
  # One judge per RAGAS metric, the same for every answer in both configurations.
  # Faithfulness is never judged by the synthesizer's own model. Three judges also
  # means three daily token budgets (Groq's free tier allows 200k tokens a day each).
  judges:
    faithfulness: qwen/qwen3.8-27b
    context_recall: openai/gpt-oss-20b
    answer_relevancy: openai/gpt-oss-120b
